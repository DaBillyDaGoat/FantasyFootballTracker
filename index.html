<style>
:root{--bg:#EDF0F4;--surface:#fff;--ink:#0F1A2B;--muted:#5C6B7E;--line:#D7DEE7;--accent:#2447C7;--crit:#B3261E;--crit-soft:#FBE3E1}
@media (prefers-color-scheme:dark){:root{--bg:#0D131B;--surface:#151D28;--ink:#E8EDF3;--muted:#96A3B5;--line:#28333F;--accent:#7A96F5;--crit:#F08078;--crit-soft:#3E1A18}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 28px 24px;width:min(360px,calc(100vw - 32px));box-shadow:0 4px 18px rgba(15,26,43,.08)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-size:34px;line-height:1;margin:4px 0 18px;font-weight:700;white-space:nowrap}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:28px;letter-spacing:.35em;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.row label{margin:0;display:flex;align-items:center;gap:6px;font-size:12px}
button{font:inherit;font-weight:600;padding:9px 16px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{margin-top:12px;padding:8px 10px;border-radius:6px;background:var(--crit-soft);color:var(--crit);font-size:13px;display:none}
.foot{margin-top:16px;font-size:11px;color:var(--muted)}
</style>
